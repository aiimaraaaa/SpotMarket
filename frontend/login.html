<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotMarket — Ingresar</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <!--  HEADER  -->
    <header class="site-header">
      <div class="site-header__inner">
        <a href="index.html" class="brand">
          <span class="brand__mark"> SpotMarket</span>
          <span class="brand__tag">Formosa Capital</span>
        </a>
        <nav class="nav">
          <a href="index.html">Inicio</a>
          <a href="mapa.html">Mapa</a>
          <a href="registro.html">Registrar tienda</a>
          <a href="registro-producto.html">Subir producto</a>
          <a href="login.html" class="is-active">Ingresar</a>
        </nav>
      </div>
    </header>

    <!--  CONTENIDO PRINCIPAL  -->
    <main class="login-page d-flex align-items-center justify-content-center">
      <div class="login-card">
        <!-- Título -->
        <h1
          class="text-center mb-4"
          style="color: var(--color-ink); font-family: var(--font-display)"
        >
          SpotMarket
        </h1>

        <!--  PESTAÑAS  -->
        <ul
          class="nav nav-pills nav-justified mb-4"
          id="pills-tab"
          role="tablist"
        >
          <li class="nav-item" role="presentation">
            <button
              class="nav-link active"
              id="pills-login-tab"
              data-bs-toggle="pill"
              data-bs-target="#pills-login"
              type="button"
              role="tab"
            >
              Ingresar
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="pills-register-tab"
              data-bs-toggle="pill"
              data-bs-target="#pills-register"
              type="button"
              role="tab"
            >
              Crear cuenta
            </button>
          </li>
        </ul>

        <!--  CONTENIDO DE LAS PESTAÑAS  -->
        <div class="tab-content" id="pills-tabContent">
          <!-- PANEL: LOGIN -->

          <div
            class="tab-pane fade show active"
            id="pills-login"
            role="tabpanel"
          >
            <form id="formLogin">
              <p id="loginMsg" class="form-msg"></p>

              <div class="field">
                <label for="email">Correo electrónico</label>
                <input
                  type="email"
                  id="email"
                  class="input-field"
                  placeholder="tu@correo.com"
                  required
                />
              </div>

              <div class="field">
                <label for="clave">Contraseña</label>
                <input
                  type="password"
                  id="clave"
                  class="input-field"
                  placeholder="••••••••"
                  required
                />
              </div>

              <!-- Recuperar contraseña -->
              <div class="text-end mb-3">
                <a
                  href="#"
                  class="forgot-link"
                  onclick="
                    alert(' Enviamos un enlace de recuperación a tu correo.')
                  "
                >
                  ¿Olvidaste tu contraseña?
                </a>
              </div>

              <button type="submit" class="btn btn--primary btn--block">
                Ingresar
              </button>

              <p
                class="login-card__sesion mt-3 text-center"
                id="sesionActual"
              ></p>
            </form>
          </div>

          <!-- PANEL: REGISTRO -->

          <div class="tab-pane fade" id="pills-register" role="tabpanel">
            <form id="formRegistro">
              <p id="regMsg" class="form-msg"></p>

              <div class="field">
                <label for="regNombre">Nombre completo</label>
                <input
                  type="text"
                  id="regNombre"
                  class="input-field"
                  placeholder="Tu nombre"
                  required
                />
              </div>

              <div class="field">
                <label for="regEmail">Correo electrónico</label>
                <input
                  type="email"
                  id="regEmail"
                  class="input-field"
                  placeholder="tu@correo.com"
                  required
                />
              </div>

              <div class="field">
                <label for="regPassword">Contraseña</label>
                <input
                  type="password"
                  id="regPassword"
                  class="input-field"
                  placeholder="Mínimo 6 caracteres"
                  minlength="6"
                  required
                />
              </div>

              <div class="field">
                <label for="regRole">Tipo de cuenta</label>
                <select id="regRole" class="input-field">
                  <option value="cliente">Cliente (compro productos)</option>
                  <option value="comercio">Comercio (vendo productos)</option>
                </select>
              </div>

              <button type="submit" class="btn btn--primary btn--block">
                Crear cuenta
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!--  FOOTER  -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>SpotMarket · Formosa Capital</span>
        <span><a href="index.html">Volver al catálogo</a></span>
      </div>
    </footer>

    <!--  SCRIPTS  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
