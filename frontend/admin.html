<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotMarket — Admin</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a href="admin.html" class="brand">
          <span class="brand__mark">SpotMarket</span>
          <span class="brand__tag">Admin</span>
        </a>
        <nav class="nav">
          <a href="admin.html" class="is-active">Panel</a>
          <a href="cliente.html">Ver catálogo</a>
          <div class="avatar-dropdown" onclick="toggleDropdown(event)">
            <div class="avatar-circle" id="avatarIniciales">U</div>
            <div class="dropdown-menu-custom" id="dropdownMenu">
              <div class="user-name" id="userNameDisplay">Usuario</div>
              <div class="divider"></div>
              <a href="#" id="cerrarSesion">Cerrar sesión</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main class="container page">
      <h1>Panel de Administración</h1>
      <p>Bienvenido, <strong id="nombreAdmin"></strong>.</p>

      <div class="admin-stats">
        <div class="stat-card">
          <h3>Usuarios</h3>
          <p id="totalUsuarios">0</p>
        </div>
        <div class="stat-card">
          <h3>Tiendas</h3>
          <p id="totalTiendas">0</p>
        </div>
        <div class="stat-card">
          <h3>Productos</h3>
          <p id="totalProductos">0</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>SpotMarket · Formosa Capital</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
