<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de comercios — SpotMarket</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/mapa.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body>
    <!--  HEADER  -->
    <header class="site-header">
      <div class="site-header__inner">
        <a href="index.html" class="brand">
          <span class="brand__mark">SpotMarket</span>
          <span class="brand__tag">Formosa Capital</span>
        </a>
        <nav class="nav">
          <a href="index.html">Inicio</a>
          <a href="mapa.html" class="is-active">Mapa</a>
          <a href="registro.html">Registrar tienda</a>
          <a href="registro-producto.html">Subir producto</a>
          <a href="login.html">Ingresar</a>
        </nav>
      </div>
    </header>

    <!--  CONTENIDO PRINCIPAL  -->
    <main class="mapa-page">
      <aside class="mapa-sidebar">
        <div class="mapa-sidebar__header">
          <h1>Comercios en el mapa</h1>
          <p>Explorá los negocios registrados en Formosa Capital.</p>

          <input
            type="search"
            id="filtroBusqueda"
            placeholder="Buscar comercio…"
            aria-label="Buscar comercio"
          />

          <div class="chips" id="categoriaChips"></div>
        </div>

        <ul class="tienda-list" id="tiendaList">
          <!-- Se llena por JS -->
        </ul>
      </aside>

      <div id="mapa" class="mapa-lienzo"></div>
    </main>

    <!--Botón flotante de WhatsApp  -->
    <a
      href="#"
      id="whatsappFab"
      class="whatsapp-fab"
      target="_blank"
      rel="noopener"
      aria-label="Escribinos por WhatsApp"
    ></a>

    <!--  FOOTER -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>SpotMarket · Formosa Capital</span>
        <span><a href="index.html">Volver al catálogo</a></span>
      </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/common.js"></script>
    <script src="js/mapa.js"></script>
  </body>
</html>
