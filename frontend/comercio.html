<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Comercio — SpotMarket</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/comercio.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a href="comercio.html" class="brand">
          <span class="brand__mark">SpotMarket</span>
          <span class="brand__tag">Comercio</span>
        </a>
        <nav class="nav">
          <a href="comercio.html" class="is-active">Panel</a>
          <a href="registro-producto.html">Subir producto</a>
          <a href="index.html">Ver catálogo</a>
          <a href="#" id="cerrarSesion">Cerrar sesión</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1>Panel de Comercio</h1>
          <p>Bienvenido, <strong id="nombreComercio"></strong>.</p>
          <p class="text-muted">Acá podrás gestionar tus productos.</p>
        </div>
        <button class="btn btn-success" onclick="cargarProductos()">
          Actualizar
        </button>
      </div>

      <!-- SECCIÓN: PRODUCTOS DEL COMERCIO -->

      <section class="comercio-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2>Mis Productos</h2>
          <a href="registro-producto.html" class="btn btn-success btn-sm"
            >+ Nuevo producto</a
          >
        </div>
        <div class="table-responsive">
          <table class="table table-comercio table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Stock</th>
                <th>Oferta</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaProductos">
              <tr>
                <td colspan="7" class="text-center">Cargando productos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- MODAL PARA EDITAR PRODUCTO -->

    <div class="modal fade" id="modalProducto" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Producto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="formProducto">
              <input type="hidden" id="productoId" />
              <div class="mb-2">
                <label>Nombre</label>
                <input type="text" id="pNombre" class="form-control" required />
              </div>
              <div class="mb-2">
                <label>Precio</label>
                <input
                  type="number"
                  id="pPrecio"
                  class="form-control"
                  step="0.01"
                  required
                />
              </div>
              <div class="mb-2">
                <label>Categoría</label>
                <select id="pCategoria" class="form-select">
                  <option value="carnes">Carnes</option>
                  <option value="verduras">Verduras</option>
                  <option value="frutas">Frutas</option>
                  <option value="lacteos">Lácteos</option>
                  <option value="panaderia">Panadería</option>
                  <option value="bebidas">Bebidas</option>
                  <option value="infusiones">Infusiones</option>
                  <option value="secos">Secos</option>
                  <option value="conservas">Conservas</option>
                  <option value="huevos">Huevos</option>
                  <option value="almacen">Almacén</option>
                </select>
              </div>
              <div class="mb-2">
                <label>Stock (cantidad disponible)</label>
                <input
                  type="number"
                  id="pStock"
                  class="form-control"
                  min="0"
                  value="0"
                />
              </div>
              <div class="mb-2">
                <label>En oferta</label>
                <select id="pOferta" class="form-select">
                  <option value="false">No</option>
                  <option value="true">Sí</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-success"
              onclick="guardarProducto()"
            >
              Guardar
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>SpotMarket · Formosa Capital</span>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/common.js"></script>
    <script src="js/comercio.js"></script>
  </body>
</html>
